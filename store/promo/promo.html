  <style>

      --blue: #4a95f0;
      --amber: #f5a524;
      --green: #3fbf72;

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {

      justify-content: center;

    .stage { display: flex; align-items: center; gap: var(--gap); }

    .mark { display: flex; gap: calc(var(--u) * 1.1); align-items: flex-start; height: calc(var(--u) * 11); }

    .wordmark { color: #f4f2ee; font-weight: 800; font-size: calc(var(--u) * 7.5); letter-spacing: -0.02em; line-height: 1; }

    .board { display: flex; gap: calc(var(--u) * 1.6); align-items: flex-start; }
    .col {

      padding: calc(var(--u) * 1.2);
      border-radius: calc(var(--u) * 1.6);
      background: var(--navy-2);
      border-top: calc(var(--u) * 0.7) solid var(--c);
      display: flex; flex-direction: column; gap: calc(var(--u) * 1.1);
      box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 4) rgba(0,0,0,.35);
    }
    .col:nth-child(2) { margin-top: calc(var(--u) * 3); }
    .col:nth-child(3) { margin-top: calc(var(--u) * 1); }
    .col:nth-child(4) { margin-top: calc(var(--u) * 4); }
    .head { height: calc(var(--u) * 1.4); width: 60%; border-radius: 99px; background: var(--c); opacity: .9; }
    .card {
      background: #fff;
      border-radius: calc(var(--u) * 1);
      padding: calc(var(--u) * 1);
      display: flex; flex-direction: column; gap: calc(var(--u) * 0.7);
    }
    .ph { height: calc(var(--u) * 5.2); border-radius: calc(var(--u) * 0.7); background: var(--p); }
    .ln { height: calc(var(--u) * 0.9); border-radius: 99px; background: #d9d6cf; }
    .ln.s { width: 55%; background: var(--c); }

    body.small { --u: 5.6px; --gap: 34px; }
    body.small .wordmark { display: none; }
